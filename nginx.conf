server {
    listen 80;
    server_name tu_dominio.com;  # Reemplaza con tu dominio
    return 301 https://$host$request_uri;  # Redirige todo a HTTPS
}

server {
    listen 443 ssl;
    server_name tu_dominio.com;  # Reemplaza con tu dominio

    ssl_certificate /etc/nginx/certificados/tu_certificado.pem; # Ruta al certificado
    ssl_certificate_key /etc/nginx/certificados/tu_clave.pem;     # Ruta a la clave privada

    # Configuración de SSL (puedes ajustar esto para mayor seguridad)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://web:5000;  # Reenvía las solicitudes a la aplicación web
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}