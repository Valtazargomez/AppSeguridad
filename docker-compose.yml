version: "3.8"
services:
  web:
    build: .
    ports:
      - "5000:5000"
  nginx:
    image: nginx:alpine  # Usa una imagen de Nginx ligera
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Monta la configuración de Nginx
      - ./certificados:/etc/nginx/certificados # Monta los certificados (opcional)
    ports:
      - "80:80"   # Puerto HTTP
      - "443:443"  # Puerto HTTPS
    depends_on:
      - web  # Nginx depende de que la aplicación web esté en funcionamiento